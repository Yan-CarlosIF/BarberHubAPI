services:
  database:
    image: postgres:15
    container_name: barberhub-db
    ports:
      - "25432:5432"
    environment:
      POSTGRES_USER:  ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD:  ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: barberhub
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    container_name: barberhub-redis
    image: redis:alpine
    ports:
      - 26379:6379
    volumes:
      - redisdata:/data

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local