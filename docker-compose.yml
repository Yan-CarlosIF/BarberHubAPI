services:
  database:
    image: postgres
    container_name: barberhub-db
    ports:
      - "25432:5432"
    environment:
      POSTGRES_USER:  ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD:  ${POSTGRES_PASSWORD:-123}
      POSTGRES_DB: barberhub
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    container_name: barberhub-redis
    image: redis:alpine
    ports:
      - 26379:6379

  app:
    build: .
    container_name: barberhub-api
    env_file:
      - .env
    ports:
      - "3333:3333"
    command: npm run dev
    volumes:
      - .:/usr/app
    depends_on:
      - database
      - redis

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local